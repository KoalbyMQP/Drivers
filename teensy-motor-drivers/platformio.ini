; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; PlatformIO Project Configuration File
; Two programs live in this project:
;   teensy41  = Ava's robot firmware (src/ except src/benchmark/)
;   benchmark = motor benchmark tests (src/benchmark/ only)

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DUSB_SERIAL
build_src_filter = +<*> -<benchmark/>
monitor_speed = 1000000
monitor_eol = LF
lib_deps = arduino-libraries/Servo@^1.3.0
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO

[env:benchmark]
platform = teensy
board = teensy41
framework = arduino
build_flags = -DUSB_SERIAL
build_src_filter = +<benchmark/>
monitor_speed = 115200
monitor_eol = LF